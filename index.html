<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Loop City Deluxe</title><link rel="stylesheet" href="style.css"></head><body>
<div id="app">
<section id="home" class="screen active"><div class="homeShade"></div><div class="logo"><span>LOOP</span><b>CITY</b><small>BUS JAM</small></div><img class="heroBus" src="assets/bus/yellow.png"><div class="homePassengers"><img src="assets/people/red.png"><img src="assets/people/blue.png"></div><div class="homeActions"><button id="play" class="cta play">PLAY GAME <i>▶</i></button><button id="enter" class="cta code">🔑 ENTER LEVEL CODE</button><button id="select" class="round">🏆<small>Levels</small></button><button class="round">⚙️<small>Settings</small></button><button class="round">📊<small>Stats</small></button><button class="round">🎮<small>More</small></button></div></section>
<section id="game" class="screen"><div id="scene" class="scene city"><img id="sceneBg" src="assets/bg/city.png"><header><button id="homeBtn">‹</button><button class="pause">Ⅱ</button><div class="level">LEVEL <b id="levelNum">1</b></div><div class="money">🪙 <b id="coins">320</b></div></header><div id="needs" class="needs"></div><div id="passengers" class="passengers"></div><div id="buses" class="buses"></div><div id="fx" class="fx"></div></div><div class="tray"><div id="slots" class="slots"></div><div class="powerups"><button id="undo">↶<small>UNDO</small><em>3</em></button><button id="hint">💡<small>HINT</small><em>3</em></button><button id="shuffle">🔀<small>SHUFFLE</small><em>3</em></button></div></div></section>
<section id="levels" class="screen levelScreen"><div class="levelTop"><button id="levelsBack">‹</button><h1>LEVELS</h1></div><div id="grid" class="grid"></div></section>
</div>
<div id="codeModal" class="modal"><div class="dialog"><button class="close">×</button><div class="key">🔑</div><h2>ENTER LEVEL CODE</h2><input id="codeInput" placeholder="LOOP-XXX-XX" maxlength="11"><p id="err"></p><button id="confirm">CONFIRM</button></div></div>
<div id="win" class="modal"><div class="dialog win"><h1>LEVEL CLEARED!</h1><div class="stars">★★★</div><p>Your level code</p><code id="winCode"></code><button id="copy">COPY CODE</button><button id="next">NEXT LEVEL ▶</button><button id="winHome">HOME</button></div><div class="confetti"></div></div>
<script src="game.js"></script></body></html>

<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Loop City V4</title><link rel="stylesheet" href="style.css"></head><body><main id="app">
<section id="home" class="screen active"><div class="home-art"><h1><span>LOOP</span><b>CITY</b><small>BUS JAM</small></h1><img src="assets/bus/yellow-right.png"><div class="hero-people"><img src="assets/people/red-1.png"><img src="assets/people/blue-2.png"><img src="assets/people/yellow-3.png"></div></div><button id="play" class="main green">PLAY GAME ▶</button><button id="codeOpen" class="main blue">🔑 ENTER LEVEL CODE</button><button id="levelsOpen" class="levelButton">🏆 LEVELS</button></section>
<section id="game" class="screen"><header><button id="back">‹</button><button>Ⅱ</button><strong>LEVEL <span id="level">1</span></strong><b>🪙 <span id="coins">320</span></b></header><div class="stack">
<section class="passenger-zone"><div class="label">PASSENGER QUEUES</div><div id="queues"></div></section>
<section class="parking-zone"><div class="label">BOARDING PARK</div><div id="parking"></div></section>
<section class="road-zone"><div class="road-lines"></div><div id="departing"></div></section>
<section class="bus-zone"><div class="label">TAP A BUS</div><div id="busPile"></div></section>
<section class="tools"><button id="undo">↶<small>UNDO</small><em>3</em></button><button id="hint">💡<small>HINT</small><em>3</em></button><button id="shuffle">🔀<small>SHUFFLE</small><em>3</em></button></section></div><div id="toast"></div></section>
<section id="levels" class="screen levels"><header><button id="levelBack">‹</button><h2>LEVELS</h2></header><div id="grid"></div></section></main>
<div id="codeModal" class="modal"><div><button class="x">×</button><h2>ENTER LEVEL CODE</h2><input id="codeInput" placeholder="LOOP-XXX-XX"><p id="error"></p><button id="confirm">CONFIRM</button></div></div>
<div id="win" class="modal"><div><h2>LEVEL CLEARED!</h2><p class="stars">★★★</p><code id="levelCode"></code><button id="copy">COPY CODE</button><button id="next">NEXT LEVEL ▶</button></div></div>
<script src="game.js"></script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#169ee8"><title>Loop City: Bus Puzzle</title><link rel="stylesheet" href="style.css"></head><body>
<div id="app">
<section id="home" class="page active"><div class="homeShade"></div><div class="homeTop"><button id="settingsBtn" class="round">⚙</button></div><div class="brand"><span>BUS</span><strong>LOOP</strong><small>CITY PUZZLE</small></div><div class="homeBus" aria-hidden="true"><div class="busBody yellow"><i></i><i></i><i></i><b>BUS</b></div></div><div class="homeActions"><button id="playBtn" class="big green">开始游戏 <b>▶</b></button><button id="codeBtn" class="big blue">🔑 输入关卡代码</button><button id="levelsBtn" class="big navy">🏆 关卡选择</button><button id="continueBtn" class="textBtn">继续上次进度</button></div><footer>原创美术与游戏实现 · 100 LEVELS</footer></section>
<section id="game" class="page"><header class="gameHeader"><button id="backBtn" class="round">‹</button><div class="levelPill"><b id="levelTitle">LEVEL 1</b><small id="levelCode">LOOP-001-XX</small></div><div class="currency">🪙 <b id="coins">320</b></div></header><div class="objective"><div id="targets"></div><span id="moves">0 MOVES</span></div><main id="board"><img src="assets/roundabout.png" alt="原创卡通城市环岛"><div id="road" aria-label="环形道路车辆"></div><div id="passengers" aria-label="候车乘客"></div><div id="fx"></div></main><section class="garage"><div class="garageTitle"><span>选择巴士</span><small>仅前三辆可出发</small></div><div id="queue"></div></section><nav class="tools"><button id="undoBtn"><i>↶</i><span>撤销</span><em id="undoCount">3</em></button><button id="hintBtn"><i>💡</i><span>提示</span><em>3</em></button><button id="shuffleBtn"><i>🔀</i><span>洗牌</span><em>3</em></button><button id="restartBtn"><i>↻</i><span>重玩</span></button></nav></section>
<section id="levels" class="page"><header class="subHeader"><button id="levelBack" class="round">‹</button><h2>关卡选择</h2><span></span></header><div class="tabs"><button class="active">1–25</button><button>26–50</button><button>51–75</button><button>76–100</button></div><div id="levelGrid"></div></section>
<div id="dialog" class="overlay" hidden><div class="card"><button class="close" id="dialogClose">×</button><h2>输入关卡代码</h2><p>输入通关时保存的代码，可直接进入相应关卡。</p><input id="codeInput" maxlength="12" placeholder="LOOP-020-XX" autocomplete="off"><div id="codeError"></div><button id="codeGo" class="big green">确认进入</button></div></div>
<div id="win" class="overlay" hidden><div class="card winCard"><div class="rays"></div><div class="stars"><span>★</span><span>★</span><span>★</span></div><h2>LEVEL CLEARED!</h2><p>本关继续代码</p><strong id="winCode" class="codeBox"></strong><button id="copyCode" class="smallAction">复制代码</button><div class="reward">🪙 +30</div><button id="nextBtn" class="big green">下一关 ▶</button><button id="winHome" class="textBtn">返回首页</button></div></div>
<div id="toast" role="status"></div>
</div><script src="game.js"></script></body></html>

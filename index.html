<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Loop Bus Puzzle</title><link rel="stylesheet" href="style.css"></head><body><main id="app">
<section id="home" class="screen active"><div class="hero"><div class="logo">🚌</div><h1>LOOP BUS</h1><p>安排巴士进入环路，匹配乘客颜色并清空车站</p><button id="startBtn" class="primary">开始游戏</button><button id="codeBtn">输入关卡代码</button><button id="continueBtn" class="ghost">继续上次进度</button><p class="note">原创网页益智游戏 · 100 关</p></div></section>
<section id="game" class="screen"><header><button id="homeBtn" aria-label="返回首页">⌂</button><div><b id="levelName">LEVEL 1</b><small id="levelCode"></small></div><div class="tools"><button id="restartBtn">↻</button><button id="soundBtn">🔊</button></div></header><div class="stats"><span>乘客 <b id="leftCount">0</b></span><span>环路 <b id="roadCount">0</b>/<b id="roadCap">0</b></span></div><canvas id="canvas"></canvas><div id="queue" aria-label="巴士队列"></div><p id="tip">点击下方巴士，让它进入环路</p></section>
<div id="modal" class="modal" hidden><div class="card"><h2 id="modalTitle">输入关卡代码</h2><p id="modalText">输入代码，从对应关卡继续：</p><input id="codeInput" maxlength="12" autocomplete="off" placeholder="例如 LOOP-001-X"><p id="error" class="error"></p><div class="actions"><button id="cancelBtn">取消</button><button id="goBtn" class="primary">进入关卡</button></div></div></div>
<div id="win" class="modal" hidden><div class="card center"><div class="stars">★★★</div><h2>关卡完成！</h2><p>关卡代码</p><div id="winCode" class="code"></div><p class="muted">保存此代码，可在首页继续本关进度</p><button id="nextBtn" class="primary">下一关</button><button id="copyBtn">复制代码</button></div></div>
</main><script src="game.js"></script></body></html>
